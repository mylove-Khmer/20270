<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ហ្គេមទាយលេខ ២ ខ្ទង់ - រាប់ថយក្រោយ ១ នាទី</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .game-card {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .title { font-size: 20px; font-weight: bold; color: #facc15; margin-bottom: 6px; }
    .round-info { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }

    /* Timer Style */
    .timer-container {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .timer-val { font-size: 28px; font-weight: bold; color: #38bdf8; font-family: monospace; }
    .timer-val.warning { color: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }

    /* Result Ball */
    .result-ball {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      background: radial-gradient(circle, #334155 0%, #0f172a 100%);
      border: 3px dashed #facc15;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 46px;
      font-weight: bold;
      color: #facc15;
    }

    .form-group { margin-bottom: 12px; text-align: left; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #facc15; }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: 0.2s;
    }
    .btn-submit:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }

    .status-box {
      margin-top: 14px;
      min-height: 24px;
      font-size: 14px;
      font-weight: 500;
    }
    .win { color: #4ade80; }
    .lose { color: #f87171; }

    /* History Table */
    .history-section {
      margin-top: 20px;
      border-top: 1px solid #334155;
      padding-top: 15px;
      text-align: left;
    }
    .history-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .history-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .history-item {
      background: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      color: #facc15;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="title">ឆ្នោតទស្សន៍ទាយលេខ ២ ខ្ទង់</div>
    <div class="round-info">ជុំទី: <span id="roundNumber">#1001</span> | ពិន្ទុ: <span id="balance" style="color:#38bdf8; font-weight:bold;">500</span> $</div>

    <!-- នាឡិការាប់ថយក្រោយ -->
    <div class="timer-container">
      <span style="font-size: 14px; color: #94a3b8;">ពេលវេលានៅសល់:</span>
      <div class="timer-val" id="timer">01:00</div>
    </div>

    <!-- លេខចេញចុងក្រោយ -->
    <div class="result-ball" id="resultDisplay">--</div>

    <!-- ទម្រង់ចាក់ភ្នាល់ -->
    <div class="form-group">
      <label>លេខទាយ (00 ដល់ 99):</label>
      <input type="number" id="guessInput" placeholder="ឧទាហរណ៍: 28" min="0" max="99" />
    </div>

    <div class="form-group">
      <label>ចំនួនទឹកប្រាក់ ($):</label>
      <input type="number" id="betInput" value="5" min="1" />
    </div>

    <button class="btn-submit" id="betBtn" onclick="placeBet()">ដាក់ទាយជុំនេះ</button>

    <div class="status-box" id="statusMessage">សូមបញ្ចូលលេខ និងទឹកប្រាក់មុនពេលអស់ម៉ោង!</div>

    <!-- ប្រវត្តិលេខដែលធ្លាប់ចេញ -->
    <div class="history-section">
      <div class="history-title">ប្រវត្តិលេខចេញកន្លងមក:</div>
      <div class="history-list" id="historyList">
        <span class="history-item">08</span>
        <span class="history-item">45</span>
        <span class="history-item">92</span>
      </div>
    </div>
  </div>

  <script>
    let timeLeft = 60; // ៦០ វិនាទី
    let currentRound = 1001;
    let balance = 500;
    const MULTIPLIER = 70; // ឈ្នះគុណនឹង ៧០

    let activeBet = null; // កត់ត្រាការចាក់ក្នុងជុំបច្ចុប្បន្ន

    const timerEl = document.getElementById('timer');
    const resultDisplay = document.getElementById('resultDisplay');
    const statusMsg = document.getElementById('statusMessage');
    const betBtn = document.getElementById('betBtn');
    const balanceEl = document.getElementById('balance');
    const historyList = document.getElementById('historyList');

    // មុខងាររាប់ថយក្រោយ (Timer Loop)
    setInterval(() => {
      timeLeft--;

      // បង្ហាញទម្រង់ 00:XX
      const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
      timerEl.innerText = `00:${seconds}`;

      // ៥ វិនាទីចុងក្រោយ បិទមិនឱ្យចាក់ (Lock Phase)
      if (timeLeft <= 5 && timeLeft > 0) {
        timerEl.classList.add('warning');
        betBtn.disabled = true;
        betBtn.innerText = "បានចាក់សោ (កំពុងរង់ចាំលទ្ធផល...)";
      }

      // ដល់វិនាទីទី ០ -> ចេញលទ្ធផល
      if (timeLeft <= 0) {
        drawResult();
        timeLeft = 60; // Reset មក ៦០ វិនាទីវិញ
        timerEl.classList.remove('warning');
        betBtn.disabled = false;
        betBtn.innerText = "ដាក់ទាយជុំនេះ";
      }
    }, 1000);

    // មុខងារដាក់ភ្នាល់
    function placeBet() {
      const numVal = document.getElementById('guessInput').value;
      const betVal = parseInt(document.getElementById('betInput').value);

      if (numVal === "" || isNaN(numVal) || parseInt(numVal) < 0 || parseInt(numVal) > 99) {
        alert("សូមបញ្ចូលលេខ ២ ខ្ទង់ត្រឹមត្រូវ (00-99)!");
        return;
      }
      if (isNaN(betVal) || betVal <= 0) {
        alert("សូមបញ្ចូលចំនួនទឹកប្រាក់ត្រឹមត្រូវ!");
        return;
      }
      if (betVal > balance) {
        alert("ទឹកប្រាក់របស់អ្នកមិនគ្រប់គ្រាន់ទេ!");
        return;
      }

      const formattedGuess = String(parseInt(numVal)).padStart(2, '0');
      
      // កាត់ទឹកប្រាក់
      balance -= betVal;
      balanceEl.innerText = balance;

      // រក្សាទុកទិន្នន័យចាក់
      activeBet = { number: formattedGuess, amount: betVal };

      statusMsg.innerText = `អ្នកបានចាក់លេខ [${formattedGuess}] ចំនួន $${betVal} សម្រាប់ជុំ #${currentRound}`;
      statusMsg.className = "status-box";
      betBtn.disabled = true;
    }

    // មុខងារចេញរង្វាន់
    function drawResult() {
      // ចាប់លេខចៃដន្យ 00-99
      const randomNum = Math.floor(Math.random() * 100);
      const winningNumber = String(randomNum).padStart(2, '0');

      resultDisplay.innerText = winningNumber;

      // ពិនិត្យលទ្ធផលអ្នកលេង
      if (activeBet) {
        if (activeBet.number === winningNumber) {
          const winPrize = activeBet.amount * MULTIPLIER;
          balance += winPrize;
          balanceEl.innerText = balance;
          statusMsg.innerText = `អបអរសាទរ! ជុំ #${currentRound} ចេញ [${winningNumber}] អ្នកឈ្នះ +$${winPrize}!`;
          statusMsg.className = "status-box win";
        } else {
          statusMsg.innerText = `សោកស្ដាយ! ជុំ #${currentRound} ចេញ [${winningNumber}] (អ្នកចាញ់ -$${activeBet.amount})`;
          statusMsg.className = "status-box lose";
        }
        activeBet = null; // Reset ការចាក់
      } else {
        statusMsg.innerText = `ជុំ #${currentRound} ចេញលេខ [${winningNumber}] (អ្នកមិនបានចាក់ទេ)`;
        statusMsg.className = "status-box";
      }

      // បន្ថែមលេខចូលប្រវត្តិ (History)
      const newItem = document.createElement('span');
      newItem.className = 'history-item';
      newItem.innerText = winningNumber;
      historyList.insertBefore(newItem, historyList.firstChild);

      // បង្កើនជុំបន្ទាប់
      currentRound++;
      document.getElementById('roundNumber').innerText = `#${currentRound}`;
      document.getElementById('guessInput').value = '';
    }
  </script>

</body>
</html>
