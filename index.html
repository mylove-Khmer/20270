<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa368 - ហ្គេមទស្សន៍ទាយលេខ ២ ខ្ទង់</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b1120;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #334155;
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #facc15;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .round-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .badge {
      color: #38bdf8;
      font-weight: bold;
    }
    
    /* នាឡិការាប់ថយក្រោយ */
    .timer-panel {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-title {
      font-size: 14px;
      color: #94a3b8;
    }
    .timer-clock {
      font-size: 30px;
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
    }
    .timer-clock.lock {
      color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.4; }
    }

    /* ផ្ទាំងបង្ហាញលេខដែលចេញ */
    .ball-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      background: radial-gradient(circle, #334155 0%, #0f172a 100%);
      border: 3px dashed #facc15;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 46px;
      font-weight: 800;
      color: #facc15;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    /* Input Sections */
    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }
    label {
      font-size: 13px;
      color: #cbd5e1;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #facc15;
    }

    /* ប៊ូតុង */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-submit:hover:not(:disabled) {
      background: #eab308;
    }
    .btn-submit:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* ប្រអប់ប្រាប់ដំណឹង */
    .status-alert {
      margin-top: 15px;
      min-height: 24px;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .text-win { color: #4ade80; }
    .text-lose { color: #f87171; }

    /* ប្រវត្តិលេខកន្លងមក */
    .history-box {
      margin-top: 20px;
      border-top: 1px solid #334155;
      padding-top: 14px;
      text-align: left;
    }
    .history-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .history-items {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .num-chip {
      background: #334155;
      color: #facc15;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="logo">FAFA368 LOTTO 2D</div>
    <div class="round-info">
      ជុំទី: <span class="badge" id="roundNum">#1001</span> | 
      ទឹកប្រាក់: <span class="badge" id="myBalance">500</span> $
    </div>

    <!-- នាឡិការាប់ថយក្រោយ 1 នាទី -->
    <div class="timer-panel">
      <span class="timer-title">រាប់ថយក្រោយ (1 នាទី):</span>
      <div class="timer-clock" id="timer">01:00</div>
    </div>

    <!-- ផ្ទាំងគ្រាប់បាល់លេខ -->
    <div class="ball-container" id="ballDisplay">--</div>

    <!-- កន្លែងបញ្ចូលលេខ និងលុយ -->
    <div class="form-group">
      <label>បញ្ចូលលេខ ២ ខ្ទង់ (00 ដល់ 99):</label>
      <input type="number" id="numField" placeholder="ឧ. 68" min="0" max="99" />
    </div>

    <div class="form-group">
      <label>ទឹកប្រាក់ចាក់ ($):</label>
      <input type="number" id="betField" value="5" min="1" />
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitBet()">ដាក់ទាយឥឡូវនេះ</button>

    <div class="status-alert" id="statusBox">សូមបញ្ចូលលេខមុនពេលអស់ម៉ោង!</div>

    <!-- ប្រវត្តិលេខ -->
    <div class="history-box">
      <div class="history-title">ប្រវត្តិលេខចេញចុងក្រោយ:</div>
      <div class="history-items" id="historyBar">
        <span class="num-chip">12</span>
        <span class="num-chip">78</span>
        <span class="num-chip">35</span>
      </div>
    </div>
  </div>

  <script>
    // --- ប្រព័ន្ធសំឡេង Web Audio API ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // សំឡេងរាប់ថយក្រោយ (Tick)
    function playTickSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // សំឡេងឈ្នះ (Win Fanfare)
    function playWinSound() {
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.12);
          osc.stop(audioCtx.currentTime + idx * 0.12 + 0.35);
        });
      } catch (e) {}
    }

    // សំឡេងចាញ់ (Lose Tone)
    function playLoseSound() {
      try {
        initAudio();
        const tones = [350, 260];
        tones.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.2);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.2);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.2 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.2);
          osc.stop(audioCtx.currentTime + idx * 0.2 + 0.3);
        });
      } catch (e) {}
    }

    // --- ប្រព័ន្ធហ្គេម ---
    let secondsLeft = 60;
    let currentRound = 1001;
    let balance = 500;
    const PRIZE_RATE = 70;
    let myCurrentBet = null;

    const timerText = document.getElementById('timer');
    const ballDisplay = document.getElementById('ballDisplay');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const balanceText = document.getElementById('myBalance');
    const historyBar = document.getElementById('historyBar');

    // ដំណើរការរាប់ថយក្រោយ 1 នាទី
    setInterval(() => {
      secondsLeft--;

      const displaySec = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
      timerText.innerText = `00:${displaySec}`;

      // ឮសំឡេងរាប់ថយក្រោយនៅ ៥ វិនាទីចុងក្រោយ (Lock Phase)
      if (secondsLeft <= 5 && secondsLeft > 0) {
        timerText.classList.add('lock');
        submitBtn.disabled = true;
        submitBtn.innerText = "បានចាក់សោ (កំពុងចាប់រង្វាន់...)";
        playTickSound(); // បន្លឺសំឡេង Tick
      }

      // ដល់វិនាទី 0 -> ចេញលទ្ធផល
      if (secondsLeft <= 0) {
        processResult();
        secondsLeft = 60;
        timerText.classList.remove('lock');
        submitBtn.disabled = false;
        submitBtn.innerText = "ដាក់ទាយឥឡូវនេះ";
      }
    }, 1000);

    function submitBet() {
      initAudio(); // បើកដំណើរការ AudioContext លើ Browser
      const inputNum = document.getElementById('numField').value;
      const inputMoney = parseInt(document.getElementById('betField').value);

      if (inputNum === "" || isNaN(inputNum) || parseInt(inputNum) < 0 || parseInt(inputNum) > 99) {
        alert("សូមបញ្ចូលលេខ ២ ខ្ទង់ពី 00 ដល់ 99!");
        return;
      }
      if (isNaN(inputMoney) || inputMoney <= 0) {
        alert("សូមបញ្ចូលទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!");
        return;
      }
      if (inputMoney > balance) {
        alert("ទឹកប្រាក់របស់អ្នកមិនគ្រប់គ្រាន់ទេ!");
        return;
      }

      const formattedNum = String(parseInt(inputNum)).padStart(2, '0');

      balance -= inputMoney;
      balanceText.innerText = balance;
      myCurrentBet = { number: formattedNum, amount: inputMoney };

      statusBox.innerText = `អ្នកបានចាក់លេខ [${formattedNum}] ចំនួន $${inputMoney} សម្រាប់ជុំ #${currentRound}`;
      statusBox.className = "status-alert";
      submitBtn.disabled = true;
    }

    function processResult() {
      const drawn = Math.floor(Math.random() * 100);
      const winNum = String(drawn).padStart(2, '0');

      ballDisplay.innerText = winNum;

      if (myCurrentBet) {
        if (myCurrentBet.number === winNum) {
          const wonPrize = myCurrentBet.amount * PRIZE_RATE;
          balance += wonPrize;
          balanceText.innerText = balance;
          statusBox.innerText = `អបអរសាទរ! ជុំ #${currentRound} ចេញ [${winNum}] អ្នកឈ្នះ +$${wonPrize}!`;
          statusBox.className = "status-alert text-win";
          playWinSound(); // បន្លឺសំឡេងឈ្នះ
        } else {
          statusBox.innerText = `សោកស្ដាយ! ជុំ #${currentRound} ចេញ [${winNum}] (អ្នកចាញ់ -$${myCurrentBet.amount})`;
          statusBox.className = "status-alert text-lose";
          playLoseSound(); // បន្លឺសំឡេងចាញ់
        }
        myCurrentBet = null;
      } else {
        statusBox.innerText = `ជុំ #${currentRound} ចេញលេខ [${winNum}] (អ្នកមិនបានចាក់ទេ)`;
        statusBox.className = "status-alert";
      }

      const chip = document.createElement('span');
      chip.className = 'num-chip';
      chip.innerText = winNum;
      historyBar.insertBefore(chip, historyBar.firstChild);

      currentRound++;
      document.getElementById('roundNum').innerText = `#${currentRound}`;
      document.getElementById('numField').value = '';
    }

    // ចុចលើអេក្រង់ដើម្បីអនុញ្ញាតឱ្យ Browser ចាក់សំឡេង
    window.addEventListener('click', initAudio, { once: true });
  </script>

</body>
</html>
