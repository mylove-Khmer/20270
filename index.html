<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa368 - ហ្គេមទស្សន៍ទាយលេខ 1 ដល់ 8</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b1120;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background: #1e293b;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #334155;
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #facc15;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .round-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .badge {
      color: #38bdf8;
      font-weight: bold;
    }
    
    /* នាឡិការាប់ថយក្រោយ */
    .timer-panel {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-title {
      font-size: 14px;
      color: #94a3b8;
    }
    .timer-clock {
      font-size: 30px;
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
    }
    .timer-clock.lock {
      color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.4; }
    }

    /* ផ្ទាំងបង្ហាញលេខដែលចេញ */
    .ball-container {
      width: 105px;
      height: 105px;
      margin: 0 auto 16px;
      background: radial-gradient(circle, #334155 0%, #0f172a 100%);
      border: 3px dashed #facc15;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 52px;
      font-weight: 800;
      color: #facc15;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    /* ប៊ូតុងរើសលេខ 1 ដល់ 8 */
    .section-title {
      font-size: 13px;
      color: #cbd5e1;
      text-align: left;
      margin-bottom: 8px;
    }
    .number-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .num-btn {
      background: #0f172a;
      border: 2px solid #475569;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      padding: 12px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .num-btn:hover:not(:disabled) {
      border-color: #facc15;
      color: #facc15;
    }
    .num-btn.selected {
      background: #facc15;
      color: #0f172a;
      border-color: #facc15;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }
    .num-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Input Sections */
    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }
    label {
      font-size: 13px;
      color: #cbd5e1;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }
    input:focus {
      border-color: #facc15;
    }

    /* ប៊ូតុងបញ្ជាក់ */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }
    .btn-submit:hover:not(:disabled) {
      background: #eab308;
    }
    .btn-submit:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* ប្រអប់ប្រាប់ដំណឹង */
    .status-alert {
      margin-top: 15px;
      min-height: 24px;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .text-win { color: #4ade80; }
    .text-lose { color: #f87171; }

    /* ប្រវត្តិលេខកន្លងមក */
    .history-box {
      margin-top: 18px;
      border-top: 1px solid #334155;
      padding-top: 12px;
      text-align: left;
    }
    .history-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .history-items {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .num-chip {
      background: #334155;
      color: #facc15;
      font-weight: bold;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="logo">FAFA368 LUCKY 1-8</div>
    <div class="round-info">
      ជុំទី: <span class="badge" id="roundNum">#1001</span> | 
      ទឹកប្រាក់: <span class="badge" id="myBalance">500</span> $
    </div>

    <!-- នាឡិការាប់ថយក្រោយ 1 នាទី -->
    <div class="timer-panel">
      <span class="timer-title">រាប់ថយក្រោយ (1 នាទី):</span>
      <div class="timer-clock" id="timer">01:00</div>
    </div>

    <!-- ផ្ទាំងគ្រាប់បាល់លេខដែលចេញ (1 ដល់ 8) -->
    <div class="ball-container" id="ballDisplay">?</div>

    <!-- ប៊ូតុងរើសលេខ ១ ដល់ ៨ -->
    <div class="section-title">ចុចជ្រើសរើសលេខដែលចង់ទាយ (1 ដល់ 8):</div>
    <div class="number-grid">
      <button class="num-btn" onclick="selectNumber(1)">1</button>
      <button class="num-btn" onclick="selectNumber(2)">2</button>
      <button class="num-btn" onclick="selectNumber(3)">3</button>
      <button class="num-btn" onclick="selectNumber(4)">4</button>
      <button class="num-btn" onclick="selectNumber(5)">5</button>
      <button class="num-btn" onclick="selectNumber(6)">6</button>
      <button class="num-btn" onclick="selectNumber(7)">7</button>
      <button class="num-btn" onclick="selectNumber(8)">8</button>
    </div>

    <div class="form-group">
      <label>ទឹកប្រាក់ចាក់ ($):</label>
      <input type="number" id="betField" value="5" min="1" />
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitBet()">ដាក់ទាយជុំនេះ</button>

    <div class="status-alert" id="statusBox">សូមចុចរើសលេខ 1-8 និងបញ្ចូលទឹកប្រាក់!</div>

    <!-- ប្រវត្តិលេខ -->
    <div class="history-box">
      <div class="history-title">ប្រវត្តិលេខចេញចុងក្រោយ:</div>
      <div class="history-items" id="historyBar">
        <span class="num-chip">3</span>
        <span class="num-chip">7</span>
        <span class="num-chip">2</span>
      </div>
    </div>
  </div>

  <script>
    // --- ប្រព័ន្ធសំឡេង Web Audio API ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTickSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function playWinSound() {
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.12);
          osc.stop(audioCtx.currentTime + idx * 0.12 + 0.35);
        });
      } catch (e) {}
    }

    function playLoseSound() {
      try {
        initAudio();
        const tones = [350, 260];
        tones.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.2);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.2);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.2 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.2);
          osc.stop(audioCtx.currentTime + idx * 0.2 + 0.3);
        });
      } catch (e) {}
    }

    // --- ប្រព័ន្ធហ្គេម ---
    let secondsLeft = 60;
    let currentRound = 1001;
    let balance = 500;
    const PRIZE_RATE = 7; // ត្រូវចំលេខ ឈ្នះគុណនឹង ៧ ដង
    let selectedNum = null;
    let myCurrentBet = null;

    const timerText = document.getElementById('timer');
    const ballDisplay = document.getElementById('ballDisplay');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const balanceText = document.getElementById('myBalance');
    const historyBar = document.getElementById('historyBar');
    const numButtons = document.querySelectorAll('.num-btn');

    // មុខងារពេលចុចរើសលេខ
    function selectNumber(num) {
      if (secondsLeft <= 5 || myCurrentBet) return;
      initAudio();
      selectedNum = num;

      numButtons.forEach(btn => {
        if (parseInt(btn.innerText) === num) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });
      statusBox.innerText = `អ្នកបានជ្រើសរើសលេខ: [${num}]`;
    }

    // រាប់ថយក្រោយ 1 នាទី
    setInterval(() => {
      secondsLeft--;

      const displaySec = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
      timerText.innerText = `00:${displaySec}`;

      // ៥ វិនាទីចុងក្រោយ បិទមិនឱ្យចាក់ និងបន្លឺសំឡេង Tick
      if (secondsLeft <= 5 && secondsLeft > 0) {
        timerText.classList.add('lock');
        submitBtn.disabled = true;
        submitBtn.innerText = "បានចាក់សោ (កំពុងចេញលទ្ធផល...)";
        numButtons.forEach(b => b.disabled = true);
        playTickSound();
      }

      // ដល់វិនាទីទី 0 -> ចេញលទ្ធផល
      if (secondsLeft <= 0) {
        processResult();
        secondsLeft = 60;
        timerText.classList.remove('lock');
        submitBtn.disabled = false;
        submitBtn.innerText = "ដាក់ទាយជុំនេះ";
        numButtons.forEach(b => {
          b.disabled = false;
          b.classList.remove('selected');
        });
        selectedNum = null;
      }
    }, 1000);

    function submitBet() {
      initAudio();
      const inputMoney = parseInt(document.getElementById('betField').value);

      if (selectedNum === null) {
        alert("សូមចុចលើប៊ូតុងលេខ (1 ដល់ 8) មួយសិន!");
        return;
      }
      if (isNaN(inputMoney) || inputMoney <= 0) {
        alert("សូមបញ្ចូលទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!");
        return;
      }
      if (inputMoney > balance) {
        alert("ទឹកប្រាក់របស់អ្នកមិនគ្រប់គ្រាន់ទេ!");
        return;
      }

      balance -= inputMoney;
      balanceText.innerText = balance;
      myCurrentBet = { number: selectedNum, amount: inputMoney };

      statusBox.innerText = `អ្នកបានចាក់លេខ [${selectedNum}] ចំនួន $${inputMoney} សម្រាប់ជុំ #${currentRound}`;
      statusBox.className = "status-alert";
      submitBtn.disabled = true;
      numButtons.forEach(b => b.disabled = true);
    }

    function processResult() {
      // ចាប់លេខចៃដន្យ ពីលេខ 1 ដល់លេខ 8 តែប៉ុណ្ណោះ
      const winNum = Math.floor(Math.random() * 8) + 1;

      ballDisplay.innerText = winNum;

      if (myCurrentBet) {
        if (myCurrentBet.number === winNum) {
          const wonPrize = myCurrentBet.amount * PRIZE_RATE;
          balance += wonPrize;
          balanceText.innerText = balance;
          statusBox.innerText = `អបអរសាទរ! ជុំ #${currentRound} ចេញលេខ [${winNum}] អ្នកឈ្នះ +$${wonPrize}!`;
          statusBox.className = "status-alert text-win";
          playWinSound();
        } else {
          statusBox.innerText = `សោកស្ដាយ! ជុំ #${currentRound} ចេញលេខ [${winNum}] (អ្នកចាញ់ -$${myCurrentBet.amount})`;
          statusBox.className = "status-alert text-lose";
          playLoseSound();
        }
        myCurrentBet = null;
      } else {
        statusBox.innerText = `ជុំ #${currentRound} ចេញលេខ [${winNum}] (អ្នកមិនបានចាក់ទេ)`;
        statusBox.className = "status-alert";
      }

      // បន្ថែមលេខចូលប្រវត្តិ
      const chip = document.createElement('span');
      chip.className = 'num-chip';
      chip.innerText = winNum;
      historyBar.insertBefore(chip, historyBar.firstChild);

      currentRound++;
      document.getElementById('roundNum').innerText = `#${currentRound}`;
    }

    window.addEventListener('click', initAudio, { once: true });
  </script>

</body>
</html>
